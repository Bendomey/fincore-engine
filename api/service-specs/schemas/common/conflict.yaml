type: object
description: >-
  The client already has a live journal entry with this reference. Retries can treat this as
  success and use journal_entry_id.
properties:
  errors:
    type: object
    properties:
      message:
        type: string
        example: a journal entry with this reference already exists
      journal_entry_id:
        type: string
        format: uuid4
        example: 7e2e0544-931c-4c07-a761-5ae95202d4e1
